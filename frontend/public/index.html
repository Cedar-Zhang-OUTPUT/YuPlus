<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Yu+ · 项目内容浏览</title>
<link rel="stylesheet" href="./styles/tokens.css">
<link rel="stylesheet" href="./styles/app.css">
</head>
<body>

<aside id="navigation" aria-label="主导航">
  <div class="brand">
    <div class="mark">Yu</div>
    <div class="brand-name"><b>Yu+</b></div>
    <button type="button" class="chipbtn directory-toggle main-nav-toggle" id="mainNavToggle" aria-label="收起主导航" aria-expanded="true" aria-controls="sideMain sideProject sideProjectSecondary"></button>
  </div>

  <div class="sgroup">浏览</div>
  <nav id="sideMain"></nav>

  <div class="sgroup">当前项目</div>
  <nav id="sideProject"></nav>

  <div class="rail-bottom">
    <nav id="sideProjectSecondary" aria-label="项目资料与记录"></nav>
    <div class="railfoot" id="railFoot"></div>
  </div>
</aside>

<div class="shell">
  <header class="toolbar" id="toolbar"></header>
  <main id="stage"></main>
</div>

<script type="module" src="./app.js"></script>
</body>
</html>
